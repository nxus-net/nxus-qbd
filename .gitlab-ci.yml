stages:
  - build
  - publish

build:
  stage: build
  image: node:22-alpine
  before_script:
    - corepack enable && corepack prepare pnpm@latest --activate
  script:
    - pnpm install
    - pnpm run generate
    - pnpm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build-compat:
  stage: build
  image: node:${NODE_VERSION}-alpine
  parallel:
    matrix:
      - NODE_VERSION: ["18", "20"]
  before_script:
    - corepack enable && corepack prepare pnpm@latest --activate
  script:
    - pnpm install
    - pnpm run generate
    - pnpm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

publish:
  stage: publish
  image: node:22-alpine
  before_script:
    - corepack enable && corepack prepare pnpm@latest --activate
  script:
    - pnpm install
    - pnpm run generate
    - pnpm run build
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    - pnpm publish --access public --no-git-checks
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  environment:
    name: npm
