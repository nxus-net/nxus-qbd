name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test

      # Packs the tarball, installs it with plain npm, and imports every
      # advertised entry point with plain node. The suite above cannot
      # catch a packaging defect: vitest resolves extensionless relative
      # specifiers that Node ESM rejects, so `build` and `test` were both
      # green while the published package threw ERR_MODULE_NOT_FOUND.
      - run: pnpm run smoke:package
